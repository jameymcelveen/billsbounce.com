<svg xmlns="http://w3.org" viewBox="0 0 1000 650" width="100%" height="100%">
<defs>
<!-- Background Space & Cloud Gradients -->
<radialGradient id="spaceBg" cx="50%" cy="30%" r="75%">
<stop offset="0%" stop-color="#111424" />
<stop offset="50%" stop-color="#080a12" />
<stop offset="100%" stop-color="#020305" />
</radialGradient>

<radialGradient id="jellyCore" cx="45%" cy="45%" r="50%">
<stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
<stop offset="25%" stop-color="#a3e2f7" stop-opacity="0.8" />
<stop offset="60%" stop-color="#3b82f6" stop-opacity="0.3" />
<stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
</radialGradient>

<linearGradient id="rocketStreak" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ffedd5" />
<stop offset="15%" stop-color="#fbcfe8" />
<stop offset="50%" stop-color="#f43f5e" />
<stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
</linearGradient>

<!-- Drop Shadow Filter for Bill's 3D Bubble Text -->
<filter id="thickShadow" x="-20%" y="-20%" width="150%" height="150%">
<feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#1e3a8a" flood-opacity="1" />
</filter>
</defs>

<!-- Canvas Background -->
<rect width="1000" height="650" fill="url(#spaceBg)" rx="16" />

<!-- ==================== BONUS MATERIAL: THE JELLYFISH PLUME ==================== -->
<g transform="translate(100, -20)">
<!-- High Altitude Diffused Cloud Structure -->
<path d="M 650,220 Q 550,120 420,160 Q 320,190 350,280 Q 380,360 480,340 Q 580,320 680,290 Q 730,260 650,220 Z" fill="url(#jellyCore)" opacity="0.45" filter="blur(8px)" />
<path d="M 600,240 Q 520,160 440,190 Q 370,210 390,270 Q 420,320 500,300 Q 580,280 630,260 Z" fill="#ffffff" opacity="0.2" filter="blur(15px)" />

<!-- Expansion Wave Rings -->
<ellipse cx="450" cy="240" rx="140" ry="80" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.25" transform="rotate(-15, 450, 240)" filter="blur(1px)" />
<ellipse cx="460" cy="245" rx="90" ry="50" fill="none" stroke="#93c5fd" stroke-width="1" opacity="0.3" transform="rotate(-12, 460, 245)" />

<!-- The Rocket Injection Streak -->
<line x1="200" y1="100" x2="430" y2="235" stroke="url(#rocketStreak)" stroke-width="6" stroke-linecap="round" />
<!-- Re-entry / Burn Point Core -->
<circle cx="205" cy="103" r="7" fill="#ffea75" filter="blur(1px)" />
<circle cx="205" cy="103" r="3" fill="#ffffff" />
</g>

<!-- ==================== THE TRUCK LOGO RECONSTRUCTION ==================== -->
<g transform="translate(50, 310)">

<!-- BILL'S BOUNCE - Core Bubble Typography Matrix -->
<g filter="url(#thickShadow)" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" text-anchor="middle">

<!-- "BILL'S" Text Construction -->
<g fill="#ef4444" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" font-size="115" letter-spacing="2">
<text x="220" y="110" transform="rotate(-4, 220, 110)">B</text>
<text x="290" y="105" transform="rotate(2, 290, 105)">I</text>
<text x="330" y="105" transform="rotate(-2, 330, 105)">L</text>
<text x="385" y="108" transform="rotate(5, 385, 108)">L</text>
<text x="440" y="100" transform="rotate(-6, 440, 100)">'</text>
<text x="475" y="112" transform="rotate(3, 475, 112)">S</text>
</g>

<!-- "BOUNCE" Text Construction -->
<g fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" font-size="115" letter-spacing="3">
<text x="590" y="115" transform="rotate(-3, 590, 115)">B</text>
<text x="670" y="112" transform="rotate(4, 670, 112)">O</text>
<text x="755" y="116" transform="rotate(-2, 755, 116)">U</text>
<text x="835" y="110" transform="rotate(5, 835, 110)">N</text>
<text x="910" y="118" transform="rotate(-4, 910, 118)">C</text>
<text x="980" y="112" transform="rotate(3, 980, 112)">E</text>
</g>
</g>

<!-- Subtitle Block Architecture (White Plate Meta-text) -->
<!-- Phone Number Component -->
<text x="450" y="200" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="46" font-weight="900" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5" letter-spacing="1">843-992-2317</text>

<!-- Target Project Domain Layer -->
<text x="450" y="245" text-anchor="middle" font-family="'Courier New', monospace, sans-serif" font-size="32" font-weight="900" fill="#f43f5e" letter-spacing="0.5">://billsbounce.com</text>

<!-- Inventory Utilities Description Tag -->
<text x="450" y="285" text-anchor="middle" font-family="'Arial', sans-serif" font-size="20" font-weight="700" fill="#93c5fd" letter-spacing="4">TENTS - TABLES - CHAIRS - INFLATABLES</text>
</g>

</svg>